kind = "web"
previewPath = "/"
title = "Dhanush Indla Portfolio"
description = "A personal portfolio for Dhanush Indla, an AI/ML Engineer showcasing production AI systems, measurable impact, technical expertise, experience, and selected projects."
version = "1.0.0"
id = "artifacts/dhanush-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20629

[services.development]
run = "pnpm --filter @workspace/dhanush-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dhanush-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/dhanush-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20629"
BASE_PATH = "/"
